<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parches</title>

<style>
  :root {
    --bg: #12131a; --card: #1c1e28; --line: #2c2f3d;
    --fg: #e8e9ee; --dim: #8b8fa3;
    --mine: #6ea8fe; --theirs: #f5a97f; --bad: #ed8796;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; max-width: 560px; margin-inline: auto;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); font-weight: 600; margin: 28px 0 10px; }
  button { font: inherit; color: inherit; cursor: pointer; border-radius: 10px; }

  #err { display: none; background: var(--bad); color: #12131a;
         padding: 10px 14px; border-radius: 10px; margin-bottom: 14px;
         font-size: 14px; white-space: pre-wrap; }

  /* login */
  #gate { text-align: center; padding-top: 22vh; }
  #gate button { background: var(--fg); color: var(--bg); border: 0;
                 padding: 14px 26px; font-weight: 600; }

  /* topbar */
  #top { display: flex; align-items: baseline; gap: 10px; }
  #top b { font-size: 20px; }
  #top button { margin-left: auto; background: none; border: 0;
                color: var(--dim); font-size: 13px; padding: 4px; }

  /* botones de carga */
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #pad button { background: var(--card); border: 1px solid var(--line);
                padding: 14px 4px; text-align: center; line-height: 1.25; }
  #pad button:disabled { opacity: .45; }
  #pad small { display: block; color: var(--dim); font-size: 12px; }
  #pad b { font-size: 19px; }

  /* totales de hoy */
  #today { display: flex; gap: 10px; }
  #today div { flex: 1; background: var(--card); border: 1px solid var(--line);
               border-radius: 10px; padding: 12px 14px; }
  #today b { display: block; font-size: 26px; line-height: 1.1; }
  #today span { font-size: 12px; color: var(--dim); }

  /* grafico */
  #chart { display: flex; gap: 3px; height: 130px; align-items: flex-end; }
  #chart > div { flex: 1; display: flex; gap: 2px; align-items: flex-end;
                 height: 100%; }
  #chart i { flex: 1; border-radius: 2px 2px 0 0; min-height: 1px; }
  #chart i.m { background: var(--mine); }
  #chart i.t { background: var(--theirs); }
  #days { display: flex; justify-content: space-between;
          font-size: 11px; color: var(--dim); margin-top: 6px; }
  #key { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #key s { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }

  /* tabla */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 9px 0; border-top: 1px solid var(--line); }
  td:last-child { text-align: right; }
  .who { color: var(--dim); font-size: 12px; }
  .undo { background: none; border: 1px solid var(--line);
          color: var(--dim); font-size: 12px; padding: 3px 10px; }
  .empty { color: var(--dim); font-size: 14px; }
</style>

<div id="err"></div>

<div id="gate" hidden>
  <p class="empty">Contador de parches</p>
  <button id="login">Entrar con Google</button>
</div>

<main id="app" hidden>
  <div id="top">
    <b id="me"></b>
    <button id="logout">salir</button>
  </div>

  <h2>Cargar</h2>
  <div id="pad"></div>

  <h2>Hoy</h2>
  <div id="today"></div>

  <h2>Últimos 14 días · mg</h2>
  <div id="chart"></div>
  <div id="days"></div>
  <div id="key"></div>

  <h2>Registros</h2>
  <table id="log"></table>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(
  'https://zjrshegfzavbmujoezwk.supabase.co',
  'sb_publishable_x6gZcTfjmyx6HoPff4cHCQ_JItYdeH2'
);

const NAMES = { 'lautaroppaniagua@gmail.com': 'Lautaro' };
const nameOf = e => NAMES[e] || e.split('@')[0];

const BRANDS = ['zyn', 'velo'];
const MGS = [3, 4, 6];
const UNDO_MS = 60 * 60 * 1000;   // igual que la politica undo_own

const $ = id => document.getElementById(id);
const dayKey = d => d.toLocaleDateString('sv');   // YYYY-MM-DD en hora local
const fail = e => { $('err').textContent = e.message || e; $('err').style.display = 'block'; };
const clearErr = () => { $('err').style.display = 'none'; };

let me = null;      // email de la sesion
let rows = [];      // ponytail: 500 filas alcanzan para dos personas, paginar si no

/* ---------- sesion ---------- */

$('login').onclick = () => sb.auth.signInWithOAuth({
  provider: 'google',
  options: { redirectTo: location.origin + location.pathname }
});

$('logout').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_, session) => {
  me = session?.user?.email ?? null;
  $('gate').hidden = !!me;
  $('app').hidden = !me;
  if (me) { $('me').textContent = nameOf(me); load(); }
});

/* ---------- datos ---------- */

async function load() {
  const { data, error } = await sb
    .from('nicotine_log')
    .select('id,email,brand,mg,at')
    .order('at', { ascending: false })
    .limit(500);

  if (error) return fail(error);

  // RLS devuelve vacio si el mail no esta en el allowlist. Sin registros propios
  // tampoco hay filas, asi que un insert de prueba es lo que distingue los casos.
  rows = data;
  clearErr();
  render();
}

async function add(brand, mg) {
  clearErr();
  const temp = { id: 'temp', email: me, brand, mg, at: new Date().toISOString() };
  rows.unshift(temp);
  render();

  const { data, error } = await sb
    .from('nicotine_log')
    .insert({ brand, mg })
    .select('id,email,brand,mg,at')
    .single();

  rows = rows.filter(r => r !== temp);
  if (error) {
    render();
    return fail(error.message.includes('policy')
      ? 'No tenés permiso para cargar. ¿Entraste con el mail correcto?'
      : error);
  }
  rows.unshift(data);
  rows.sort((a, b) => b.at.localeCompare(a.at));
  render();
}

async function undo(row) {
  clearErr();
  rows = rows.filter(r => r !== row);
  render();
  const { error } = await sb.from('nicotine_log').delete().eq('id', row.id);
  if (error) { rows.unshift(row); render(); fail(error); }
}

/* ---------- render ---------- */

function render() {
  const mine = r => r.email === me;
  // ponytail: "el otro" = todo lo que no es mio. Sirve para dos, no para tres.
  const today = dayKey(new Date());
  const sum = rs => rs.reduce((n, r) => n + r.mg, 0);

  /* hoy */
  const hoy = rows.filter(r => dayKey(new Date(r.at)) === today);
  const [a, b] = [hoy.filter(mine), hoy.filter(r => !mine(r))];
  const other = rows.find(r => !mine(r));
  $('today').innerHTML = `
    <div><b>${sum(a)}</b><span>mg · ${a.length} parche${a.length === 1 ? '' : 's'} · vos</span></div>
    <div><b>${sum(b)}</b><span>mg · ${b.length} parche${b.length === 1 ? '' : 's'} · ${
      other ? nameOf(other.email) : 'nadie más'}</span></div>`;

  /* grafico: 14 dias */
  const days = [...Array(14)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 13 + i);
    const rs = rows.filter(r => dayKey(new Date(r.at)) === dayKey(d));
    return { d, m: sum(rs.filter(mine)), t: sum(rs.filter(r => !mine(r))) };
  });
  const max = Math.max(1, ...days.map(x => Math.max(x.m, x.t)));
  $('chart').innerHTML = days.map(x => `<div title="${dayKey(x.d)}: ${x.m} / ${x.t} mg">
      <i class="m" style="height:${x.m / max * 100}%"></i>
      <i class="t" style="height:${x.t / max * 100}%"></i></div>`).join('');
  $('days').innerHTML = `<span>${days[0].d.getDate()}/${days[0].d.getMonth() + 1}</span><span>hoy</span>`;
  $('key').innerHTML = `<s style="background:var(--mine)"></s> vos &nbsp;
    <s style="background:var(--theirs)"></s> ${other ? nameOf(other.email) : 'el otro'}
    &nbsp;·&nbsp; pico ${max} mg`;

  /* tabla */
  const undoable = rows.find(r =>
    mine(r) && r.id !== 'temp' && Date.now() - new Date(r.at) < UNDO_MS);

  $('log').innerHTML = rows.slice(0, 40).map(r => {
    const d = new Date(r.at);
    const when = dayKey(d) === today
      ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    return `<tr>
      <td>${when}<div class="who">${nameOf(r.email)}</div></td>
      <td>${r.brand} · ${r.mg} mg</td>
      <td>${r === undoable ? '<button class="undo">deshacer</button>' : ''}</td>
    </tr>`;
  }).join('') || '<tr><td class="empty">Todavía nada.</td></tr>';

  const btn = $('log').querySelector('.undo');
  if (btn) btn.onclick = () => undo(undoable);
}

/* ponytail: check sin login. Consola -> demo(). Datos falsos, no toca la base. */
window.demo = () => {
  me = 'lautaroppaniagua@gmail.com';
  const now = Date.now();
  rows = [...Array(40)].map((_, i) => ({
    id: i,
    email: i % 3 === 1 ? 'roberto@gmail.com' : me,   // i=0 mio y reciente: ejercita deshacer
    brand: i % 2 ? 'zyn' : 'velo',
    mg: [3, 4, 6][i % 3],
    at: new Date(now - i * 5.5 * 3600e3).toISOString()
  })).sort((a, b) => b.at.localeCompare(a.at));

  $('gate').hidden = true; $('app').hidden = false;
  $('me').textContent = nameOf(me);
  render();

  console.assert(/^\d{4}-\d{2}-\d{2}$/.test(dayKey(new Date())), 'dayKey no da YYYY-MM-DD');
  console.assert($('chart').children.length === 14, 'el grafico no tiene 14 dias');
  console.assert($('log').rows.length === 40, 'la tabla no lista los registros');
  console.assert($('today').querySelectorAll('b').length === 2, 'faltan totales de hoy');
  console.assert(!!$('log').querySelector('.undo'), 'no aparece deshacer en el ultimo mio');
  return 'ok';
};

/* botonera: 2 marcas x 3 miligramajes */
$('pad').innerHTML = BRANDS.flatMap(brand =>
  MGS.map(mg => `<button data-b="${brand}" data-m="${mg}">
    <small>${brand}</small><b>${mg}</b></button>`)).join('');

$('pad').onclick = async e => {
  const el = e.target.closest('button');
  if (!el) return;
  $('pad').querySelectorAll('button').forEach(b => b.disabled = true);
  await add(el.dataset.b, +el.dataset.m);
  $('pad').querySelectorAll('button').forEach(b => b.disabled = false);
};
</script>
