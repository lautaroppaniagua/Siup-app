<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4FBFE">
<title>Parche</title>

<style>
/* ───── tokens: Parche Design System ───── */
:root {
  --cyan-050:#F4FBFE; --cyan-100:#E6F6FC; --cyan-200:#BEEAF8; --cyan-300:#7BD5F0;
  --cyan-400:#35BEE8; --cyan-500:#00A9E2; --cyan-600:#0090C4; --cyan-700:#0079A8;
  --navy-100:#E7EAF5; --navy-200:#C3C9E4; --navy-500:#2E3F8F;
  --navy-700:#1B2A6B; --navy-900:#101A44;
  --gray-050:#F7F8FA; --gray-100:#EFF1F4; --gray-200:#E2E5EA;
  --gray-300:#CFD3DA; --gray-500:#8C939F; --gray-700:#5A616D; --gray-900:#20242B;
  --white:#FFFFFF; --amber-500:#E8A13A; --red-500:#DC4A45;

  --surface-page:var(--cyan-050); --surface-card:var(--white);
  --surface-sunken:var(--gray-050); --surface-accent:var(--cyan-100);
  --text-strong:var(--navy-900); --text-body:var(--navy-700);
  --text-muted:var(--gray-500); --text-accent:var(--cyan-600);
  --border-hairline:var(--gray-200);
  --brand-zyn:var(--cyan-500); --brand-velo:var(--navy-500);

  --radius-xs:6px; --radius-sm:10px; --radius-md:14px;
  --radius-lg:20px; --radius-xl:28px; --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(16,26,68,.04), 0 6px 18px rgba(16,26,68,.06);
  --shadow-raised:0 2px 4px rgba(16,26,68,.05), 0 14px 32px rgba(16,26,68,.10);
  --shadow-brand:0 8px 20px rgba(0,169,226,.28);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --font-core:"Gotham","Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--surface-page); color:var(--text-body);
  font:15px/1.45 var(--font-core); -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* micro-label: mayúscula, 11px, .09em, 700 — la firma tipográfica del sistema */
.micro{text-transform:uppercase;letter-spacing:.09em;font-size:11px;
  font-weight:700;color:var(--text-muted)}
.num{font-variant-numeric:tabular-nums}

#err{display:none;margin:0 20px 12px;background:var(--red-500);color:#fff;
  padding:10px 14px;border-radius:var(--radius-md);font-size:13px;white-space:pre-wrap}

/* ───── login ───── */
#gate{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:24px;text-align:center}
#gate .mark{font-size:40px;font-weight:800;letter-spacing:-.01em;color:var(--text-strong)}
#gate p{margin:6px 0 28px}
#gate button{background:var(--cyan-500);color:#fff;font-weight:700;
  padding:0 28px;height:52px;border-radius:var(--radius-pill);box-shadow:var(--shadow-brand)}

/* ───── shell ───── */
#app{display:none;max-width:480px;margin-inline:auto}
#scroll{padding:20px 20px calc(104px + env(safe-area-inset-bottom))}

header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
header h1{margin:2px 0 0;font-size:28px;font-weight:800;
  letter-spacing:-.01em;color:var(--text-strong)}
.iconbtn{width:44px;height:44px;border-radius:var(--radius-pill);
  background:var(--surface-accent);color:var(--text-accent);
  display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--cyan-200)}

.card{background:var(--surface-card);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:20px}
.stack{display:grid;gap:12px}
.sec{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.badge{background:var(--surface-accent);color:var(--text-accent);
  font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill)}

/* hero: sin objetivo, el numero del dia es el ancla */
.hero{display:grid;justify-items:center;gap:16px}
.hero .big{font-size:56px;font-weight:800;letter-spacing:-.02em;
  line-height:1;color:var(--text-strong)}
.hero .big span{font-size:20px;font-weight:700;color:var(--text-muted);
  letter-spacing:0;margin-left:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.duo div{text-align:center;padding:12px;background:var(--surface-sunken);
  border-radius:var(--radius-md)}
.duo b{display:block;font-size:22px;font-weight:800;color:var(--text-strong)}
.duo span{display:block;margin-top:2px}

/* grilla 2x2 de carga */
#pad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{height:120px;background:var(--surface-card);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;position:relative;
  transition:transform .18s var(--ease-out),box-shadow .18s var(--ease-out)}
.tile:active{transform:scale(.96);box-shadow:var(--shadow-raised)}
.tile:disabled{opacity:.5}
.tile .brand{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.tile.zyn .brand{color:var(--brand-zyn)}
.tile.velo .brand{color:var(--brand-velo)}
.tile .mg{font-size:32px;font-weight:800;line-height:1;color:var(--text-strong)}
.tile .mg small{font-size:14px;font-weight:700;color:var(--text-muted);margin-left:3px}
.tile .count{position:absolute;top:14px;right:14px;min-width:24px;height:24px;
  padding:0 7px;border-radius:var(--radius-pill);display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff}
.tile.zyn .count{background:var(--brand-zyn)}
.tile.velo .count{background:var(--brand-velo)}

/* competencia */
.vs{display:flex;height:32px;border-radius:var(--radius-pill);overflow:hidden;
  background:var(--gray-100)}
.vs i{display:flex;align-items:center;font-size:12px;font-weight:800;color:#fff;
  min-width:0;font-style:normal;transition:width .4s var(--ease-out)}
.vs i.m{background:var(--brand-zyn);padding-left:11px}
.vs i.t{background:var(--brand-velo);justify-content:flex-end;padding-right:11px}
.vslabels{display:flex;justify-content:space-between;font-size:12px;margin-top:9px}
.vsnote{text-align:center;margin-top:10px}

/* listas */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--border-hairline)}
.row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:var(--radius-pill);flex:none}
.dot.zyn{background:var(--brand-zyn)} .dot.velo{background:var(--brand-velo)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:700;color:var(--text-strong)}
.row .t span{font-size:13px;color:var(--text-muted)}
.undo{border:1px solid var(--border-hairline);color:var(--text-muted);
  font-size:12px;font-weight:700;padding:0 14px;height:44px;border-radius:var(--radius-pill)}
.undo:active{background:var(--gray-100)}
.vacio{color:var(--text-muted);font-size:14px;padding:8px 0}

/* graficos */
#chart svg{width:100%;height:auto;display:block}
#chart path{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke}
#chart path.m{stroke:var(--brand-zyn)} #chart path.t{stroke:var(--brand-velo)}
#chart path.fill{stroke:none;opacity:.12}
#chart path.fill.m{fill:var(--brand-zyn)} #chart path.fill.t{fill:var(--brand-velo)}
.bars{display:flex;gap:2px;align-items:flex-end;height:80px}
.bars i{flex:1;background:var(--brand-zyn);border-radius:2px 2px 0 0;min-height:2px;opacity:.9}
.axis{display:flex;justify-content:space-between;margin-top:7px}
.key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-muted)}
.key s{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface-card);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:14px 16px;min-width:0}
.stat.wide{grid-column:1/-1}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--text-strong);
  line-height:1.15;overflow-wrap:anywhere}
.stat b small{font-size:13px;font-weight:700;color:var(--text-muted)}
.stat span{display:block;margin-top:3px}
.nota{color:var(--text-muted);font-size:11px;line-height:1.5;margin-top:4px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:center;
  height:calc(82px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border-hairline)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:5px;
  height:100%;justify-content:center;color:var(--text-muted);font-size:11px;font-weight:500}
#tabs button[aria-current="page"]{color:var(--text-accent);font-weight:700}
</style>

<div id="gate">
  <div class="mark">Parche</div>
  <p class="micro">contador de siups</p>
  <button id="login">Entrar con Google</button>
</div>

<div id="app">
  <div id="scroll">
    <div id="err"></div>
    <header>
      <div style="flex:1">
        <div class="micro" id="fecha"></div>
        <h1 id="titulo">Hoy</h1>
      </div>
      <button class="iconbtn" id="goajustes" aria-label="Ajustes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.2.61.77 1.03 1.42 1.03H21a2 2 0 1 1 0 4h-.09c-.65 0-1.22.42-1.42 1.03z"/></svg>
      </button>
    </header>
    <div id="vista"></div>
  </div>
  <nav id="tabs"></nav>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(
  'https://zjrshegfzavbmujoezwk.supabase.co',
  'sb_publishable_x6gZcTfjmyx6HoPff4cHCQ_JItYdeH2'
);

/* ───── perillas del mundo real ───── */
const PRECIO = { cada: 15, pesos: 6600 };            // $440 por SIUP
const CIG = { absorcion: 0.5, porPucho: 1.2 };       // estimacion, no dato medico
const OPCIONES = [['zyn',3], ['zyn',6], ['velo',4], ['velo',6]];
const NAMES = { 'lautaroppaniagua@gmail.com': 'Lautaro', 'chicchittir@gmail.com': 'Roberto' };
const UNDO_MS = 3600e3;                              // igual que la policy undo_own

/* ───── helpers ───── */
const $ = id => document.getElementById(id);
const nameOf = e => NAMES[e] || e.split('@')[0].replace(/^./, c => c.toUpperCase());
const dayKey = d => d.toLocaleDateString('sv');      // YYYY-MM-DD local
const sum = rs => rs.reduce((n, r) => n + r.mg, 0);
const plata = n => '$' + Math.round(n).toLocaleString('es-AR');
const hhmm = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const horaSola = h => (Math.round(h) % 24) + 'hs';   // sin minutos: es un promedio
const fail = e => { $('err').textContent = e.message || e; $('err').style.display = 'block'; };
const clearErr = () => { $('err').style.display = 'none'; };

let me = null;
let tab = 'hoy';
let rows = [];   // ponytail: 5000 filas ~ un año entre dos. Agregar en SQL si se pasa.

/* ───── sesion ───── */
$('login').onclick = () => sb.auth.signInWithOAuth({
  provider: 'google',
  options: { redirectTo: location.origin + location.pathname }
});

sb.auth.onAuthStateChange((_, session) => {
  me = session?.user?.email ?? null;
  $('gate').style.display = me ? 'none' : 'flex';
  $('app').style.display = me ? 'block' : 'none';
  if (me) load();
});

/* ───── datos ───── */
async function load() {
  const { data, error } = await sb.from('nicotine_log')
    .select('id,email,brand,mg,at').order('at', { ascending: false }).limit(5000);
  if (error) return fail(error);
  rows = data; clearErr(); render();
}

async function add(brand, mg) {
  clearErr();
  const temp = { id: 'temp', email: me, brand, mg, at: new Date().toISOString() };
  rows.unshift(temp); render();

  const { data, error } = await sb.from('nicotine_log')
    .insert({ brand, mg }).select('id,email,brand,mg,at').single();

  rows = rows.filter(r => r !== temp);
  if (error) {
    render();
    return fail(/policy|denied/i.test(error.message)
      ? 'No tenés permiso para cargar. ¿Entraste con el mail correcto?' : error);
  }
  rows.unshift(data); rows.sort((a, b) => b.at.localeCompare(a.at)); render();
}

async function undo(row) {
  clearErr();
  rows = rows.filter(r => r !== row); render();
  const { error } = await sb.from('nicotine_log').delete().eq('id', row.id);
  if (error) { rows.unshift(row); rows.sort((a, b) => b.at.localeCompare(a.at)); render(); fail(error); }
}

/* ───── estadisticas: funcion pura, el render solo pinta ───── */
export function stats(rows, me) {
  const mios = rows.filter(r => r.email === me);
  const otro = rows.filter(r => r.email !== me);
  const hoy = dayKey(new Date());

  const porDia = rs => rs.reduce((m, r) => {
    const k = dayKey(new Date(r.at)); m[k] = (m[k] || 0) + r.mg; return m; }, {});
  const dias = porDia(mios), diasOtro = porDia(otro);

  // ventana comun: sin esto el que arranco despues parece menos adicto solo por eso
  const primeros = rows.map(r => r.at).sort();
  const desde = primeros[0] ? new Date(primeros[0]) : new Date();
  const span = Math.max(1, Math.ceil((Date.now() - desde) / 864e5));

  const mgHoy = dias[hoy] || 0;
  const previos = Object.entries(dias).filter(([d]) => d !== hoy).map(([, v]) => v);
  const media = previos.length ? previos.reduce((a, b) => a + b, 0) / previos.length : 0;
  const rec = Object.entries(dias).sort((a, b) => b[1] - a[1])[0];

  const horas = Array(24).fill(0);
  mios.forEach(r => horas[new Date(r.at).getHours()]++);

  const primeroPorDia = {};
  mios.forEach(r => { const k = dayKey(new Date(r.at));
    if (!primeroPorDia[k] || r.at < primeroPorDia[k]) primeroPorDia[k] = r.at; });
  const arranques = Object.values(primeroPorDia)
    .map(a => { const d = new Date(a); return d.getHours() + d.getMinutes() / 60; });

  const hoyMios = mios.filter(r => dayKey(new Date(r.at)) === hoy);
  const mgTotal = sum(mios), mgOtro = sum(otro);

  return {
    hayOtro: otro.length > 0,
    nombreOtro: otro.length ? nameOf(otro[0].email) : null,
    mgHoy, countHoy: hoyMios.length,
    ultima: hoyMios[0] ? hhmm(new Date(hoyMios[0].at)) : null,
    mgHoyOtro: diasOtro[hoy] || 0,
    countHoyOtro: otro.filter(r => dayKey(new Date(r.at)) === hoy).length,
    // cuantos de cada opcion llevas hoy, para el contador de cada tile
    hoyPorOpcion: OPCIONES.map(([b, mg]) =>
      hoyMios.filter(r => r.brand === b && r.mg === mg).length),
    mgTotal, mgOtroTotal: mgOtro, count: mios.length,
    puchos: mgTotal * CIG.absorcion / CIG.porPucho,
    gastado: mios.length * (PRECIO.pesos / PRECIO.cada),
    desvio: media > 0 ? mgHoy / media : null, media,
    record: rec ? { dia: rec[0], mg: rec[1] } : null,
    horas, favorita: horas.indexOf(Math.max(...horas)),
    arranqueMedio: arranques.length
      ? arranques.reduce((a, b) => a + b, 0) / arranques.length : null,
    promedioDia: mgTotal / span,
    vs: mgOtro > 0 ? (mgTotal / mgOtro - 1) * 100 : null
  };
}

/* ───── piezas ───── */
const stat = (v, sub, cls = '') =>
  `<div class="stat ${cls}"><b>${v}</b><span class="micro">${sub}</span></div>`;

function competencia(s) {
  const total = s.mgTotal + s.mgOtroTotal;
  if (!s.hayOtro || !total) return `
    <div class="vs"><i class="m" style="width:100%">vos</i></div>
    <div class="vslabels"><b class="num">${s.mgTotal} mg</b>
      <span class="micro">esperando rival</span></div>`;
  const p = s.mgTotal / total * 100;
  return `
    <div class="vs">
      <i class="m" style="width:${p}%">${p > 18 ? Math.round(p) + '%' : ''}</i>
      <i class="t" style="width:${100 - p}%">${100 - p > 18 ? Math.round(100 - p) + '%' : ''}</i>
    </div>
    <div class="vslabels">
      <span><b style="color:var(--brand-zyn)">vos</b>
        <span class="num">${s.mgTotal.toLocaleString('es-AR')} mg</span></span>
      <span><span class="num">${s.mgOtroTotal.toLocaleString('es-AR')} mg</span>
        <b style="color:var(--brand-velo)">${s.nombreOtro}</b></span>
    </div>
    <div class="vsnote micro">${s.vs > 0
      ? `vas ${Math.round(s.vs)}% arriba`
      : `${s.nombreOtro} te saca ${Math.round(-s.vs / (1 + s.vs / 100))}%`}</div>`;
}

function lista(rs, conUndo) {
  if (!rs.length) return `<div class="vacio">Todavía ningún SIUP.</div>`;
  const undoable = conUndo && rows.find(r =>
    r.email === me && r.id !== 'temp' && Date.now() - new Date(r.at) < UNDO_MS);
  return rs.map(r => {
    const d = new Date(r.at);
    const mismoDia = dayKey(d) === dayKey(new Date());
    return `<div class="row">
      <i class="dot ${r.brand}"></i>
      <div class="t"><b>${r.brand.toUpperCase()} ${r.mg} mg</b>
        <span>${mismoDia ? hhmm(d) : d.toLocaleDateString('es-AR',
          { day: 'numeric', month: 'short' }) + ' · ' + hhmm(d)}${
          r.email !== me ? ' · ' + nameOf(r.email) : ''}</span></div>
      ${r === undoable ? '<button class="undo" data-undo="1">deshacer</button>' : ''}
    </div>`;
  }).join('');
}

/* ───── pantallas ───── */
function pantallaHoy(s) {
  const hoy = dayKey(new Date());
  const deHoy = rows.filter(r => dayKey(new Date(r.at)) === hoy && r.email === me);
  return `
  <div class="stack">
    <div class="card hero">
      <div class="big num">${s.mgHoy}<span>mg</span></div>
      <div class="duo">
        <div><b class="num">${s.countHoy}</b><span class="micro">siups</span></div>
        <div><b class="num">${s.ultima || '—'}</b><span class="micro">última</span></div>
      </div>
    </div>

    <div>
      <div class="sec"><span class="micro">Competencia</span></div>
      <div class="card">${competencia(s)}</div>
    </div>

    <div>
      <div class="sec"><span class="micro">Cargar</span></div>
      <div id="pad">${OPCIONES.map(([b, mg], i) => `
        <button class="tile ${b}" data-b="${b}" data-m="${mg}">
          <span class="brand">${b}</span>
          <span class="mg num">${mg}<small>mg</small></span>
          ${s.hoyPorOpcion[i] ? `<span class="count num">${s.hoyPorOpcion[i]}</span>` : ''}
        </button>`).join('')}</div>
    </div>

    <div>
      <div class="sec"><span class="micro">Registros de hoy</span>
        <span class="badge num">${s.mgHoy} mg</span></div>
      <div class="card" style="padding:4px 16px">${lista(deHoy, true)}</div>
    </div>
  </div>`;
}

function pantallaStats(s) {
  const mine = r => r.email === me;
  const dias30 = [...Array(30)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 29 + i);
    const rs = rows.filter(r => dayKey(new Date(r.at)) === dayKey(d));
    return { d, m: sum(rs.filter(mine)), t: sum(rs.filter(r => !mine(r))) };
  });
  const max = Math.max(1, ...dias30.map(x => Math.max(x.m, x.t)));
  const W = 340, H = 108, PAD = 6;
  const px = i => (i / 29 * W).toFixed(1);
  const py = v => (H - PAD - v / max * (H - PAD * 2)).toFixed(1);
  const linea = k => dias30.map((x, i) => `${i ? 'L' : 'M'}${px(i)},${py(x[k])}`).join(' ');
  const area = k => `${linea(k)} L${W},${H} L0,${H} Z`;
  const hmax = Math.max(1, ...s.horas);

  return `
  <div class="stack">
    <div class="card">
      <div class="sec"><span class="micro">Últimos 30 días · mg</span></div>
      <div id="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        ${s.hayOtro ? `<path class="fill t" d="${area('t')}"/><path class="t" d="${linea('t')}"/>` : ''}
        <path class="fill m" d="${area('m')}"/><path class="m" d="${linea('m')}"/>
      </svg></div>
      <div class="axis micro"><span>${dias30[0].d.getDate()}/${dias30[0].d.getMonth() + 1}</span>
        <span>${dias30[14].d.getDate()}/${dias30[14].d.getMonth() + 1}</span><span>hoy</span></div>
      <div class="key"><span><s style="background:var(--brand-zyn)"></s>vos</span>
        ${s.hayOtro ? `<span><s style="background:var(--brand-velo)"></s>${s.nombreOtro}</span>` : ''}
        <span>pico ${max} mg</span></div>
    </div>

    <div class="card">
      <div class="sec"><span class="micro">Horario</span></div>
      <div class="bars" id="hours">${s.horas.map((n, h) =>
        `<i style="height:${n / hmax * 100}%" title="${h}:00 · ${n}"></i>`).join('')}</div>
      <div class="axis micro">${[0, 6, 12, 18, 23].map(h => `<span>${h}</span>`).join('')}</div>
      <div class="key">${s.count
        ? `<span>pico a las <b style="color:var(--text-strong)">${s.favorita}:00</b>${
            s.arranqueMedio !== null ? ` · arrancás ${horaSola(s.arranqueMedio)}` : ''}</span>`
        : '<span>sin datos todavía</span>'}</div>
    </div>

    <div class="grid2">
      ${s.desvio === null ? '' : stat(`${s.desvio.toFixed(1)}×`,
        s.desvio >= 1.4 ? `más que tu promedio de ${Math.round(s.media)} mg`
        : s.desvio <= .75 ? `bajo tu promedio de ${Math.round(s.media)} mg`
        : `en línea con tu promedio`, 'wide')}
      ${stat(`${s.mgTotal.toLocaleString('es-AR')}<small> mg</small>`,
        `en total · ${s.count} siups`)}
      ${stat(plata(s.gastado), `gastado · ${plata(PRECIO.pesos / PRECIO.cada)} c/u`)}
      ${stat(Math.round(s.puchos).toLocaleString('es-AR'),
        'cigarrillos equivalentes (estimado)', 'wide')}
      ${s.record ? stat(`${s.record.mg}<small> mg</small>`,
        `récord · ${new Date(s.record.dia + 'T12:00').toLocaleDateString('es-AR',
          { day: 'numeric', month: 'long' })}`) : ''}
      ${stat(`${s.promedioDia.toFixed(1)}<small> mg</small>`, 'por día, promedio')}
    </div>
  </div>`;
}

/* ───── tab bar ───── */

  hoy: '<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>',
  stats: '<path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="14" y="6" width="3" height="11"/>',
  historial: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

};
const TABS = [['hoy','Hoy'], ['stats','Estadísticas'], ['historial','Historial'], ['ajustes','Ajustes']];
const TITULOS = { hoy:'Hoy', stats:'Estadísticas', historial:'Historial', ajustes:'Ajustes' };

$('tabs').innerHTML = TABS.map(([k, label]) => `
  <button data-tab="${k}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>
    <span>${label}</span></button>`).join('');

$('tabs').onclick = e => {
  const b = e.target.closest('button');
  if (b) { tab = b.dataset.tab; scrollTo(0, 0); render(); }
};
$('goajustes').onclick = () => { tab = 'ajustes'; scrollTo(0, 0); render(); };

/* ───── render ───── */
function render() {
  const s = stats(rows, me);
  $('fecha').textContent = new Date().toLocaleDateString('es-AR',
    { weekday: 'long', day: 'numeric', month: 'long' });
  $('titulo').textContent = TITULOS[tab];
  $('goajustes').style.visibility = tab === 'ajustes' ? 'hidden' : 'visible';

  $('vista').innerHTML =
    tab === 'hoy' ? pantallaHoy(s) :
    tab === 'stats' ? pantallaStats(s) :
    tab === 'historial' ? pantallaHistorial() : pantallaAjustes();

  [...$('tabs').children].forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));

  const pad = $('pad');
  if (pad) pad.onclick = async e => {
    const el = e.target.closest('button'); if (!el) return;
    const bs = pad.querySelectorAll('button');
    bs.forEach(b => b.disabled = true);
    await add(el.dataset.b, +el.dataset.m);
    bs.forEach(b => b.disabled = false);
  };

  const u = $('vista').querySelector('[data-undo]');
  if (u) u.onclick = () => undo(rows.find(r =>
    r.email === me && r.id !== 'temp' && Date.now() - new Date(r.at) < UNDO_MS));

  const out = $('logout');
  if (out) out.onclick = () => sb.auth.signOut();
}

/* ───── ponytail: check sin login. Consola -> demo(), demo(true) sin rival ───── */
window.demo = (solo = false) => {
  me = 'lautaroppaniagua@gmail.com';
  const now = Date.now();
  rows = []; let n = 0;
  for (let d = 0; d < 60; d++) {
    const cuantos = d === 0 ? 3 : 2 + (d * 7) % 5;
    for (let i = 0; i < cuantos; i++) {
      const at = new Date(now - d * 864e5);
      at.setHours(9 + (i * 3 + d) % 12, (i * 17) % 60, 0, 0);
      if (at > now) continue;
      const [b, mg] = OPCIONES[n % OPCIONES.length];
      rows.push({ id: n, email: n % 3 === 1 ? 'roberto@gmail.com' : me,
                  brand: b, mg, at: at.toISOString() });
      n++;
    }
  }
  if (solo) rows = rows.filter(r => r.email === me);
  rows.sort((a, b) => b.at.localeCompare(a.at));
  $('gate').style.display = 'none'; $('app').style.display = 'block';

  const A = (c, m) => console.assert(c, m);
  const fallas = [];
  for (const t of ['hoy', 'stats', 'historial', 'ajustes']) {
    tab = t; render();
    if (!$('vista').children.length) fallas.push('pantalla vacia: ' + t);
    if (document.documentElement.scrollWidth > innerWidth)
      fallas.push('scroll horizontal en ' + t);
    for (const b of $('vista').querySelectorAll('button'))
      if (b.offsetParent && b.getBoundingClientRect().height < 44)
        fallas.push(`boton <44px en ${t}: ${b.className}`);
  }
  tab = 'hoy'; render();
  const s = stats(rows, me);

  A(!fallas.length, fallas.join(' | '));
  A(/^\d{4}-\d{2}-\d{2}$/.test(dayKey(new Date())), 'dayKey no da YYYY-MM-DD local');
  A($('pad').children.length === 4, 'la grilla no tiene las 4 opciones');
  A(rows.every(r => OPCIONES.some(([b, mg]) => b === r.brand && mg === r.mg)),
    'hay un SIUP fuera de las 4 opciones');
  A(s.hoyPorOpcion.reduce((a, b) => a + b, 0) === s.countHoy,
    'los contadores de los tiles no suman los siups de hoy');
  A(s.mgTotal === sum(rows.filter(r => r.email === me)), 'mgTotal no cierra');
  A(s.gastado === s.count * 440, 'plata mal: 6600/15 = 440 por SIUP');
  A(Math.abs(s.puchos - s.mgTotal * .5 / 1.2) < 1e-6, 'equivalencia de puchos mal');
  A(s.horas.length === 24 && s.horas.reduce((a, b) => a + b) === s.count,
    'el histograma de horas no suma los siups');
  A(horaSola(23.7) === '0hs' && horaSola(11.9) === '12hs', 'la hora redondea mal');
  A(s.mgTotal + s.mgOtroTotal === sum(rows), 'los mg de la competencia no cierran');
  const anchos = [...document.querySelector('.vs').children].map(i => parseFloat(i.style.width));
  A(Math.abs(anchos.reduce((a, b) => a + b, 0) - 100) < .01, 'la barra vs no suma 100%');

  if (solo) {
    A(!s.hayOtro && s.vs === null, 'detecto un rival que no existe');
    A(anchos.length === 1 && anchos[0] === 100, 'la barra vs sin rival esta mal');
    tab = 'stats'; render();
    A(!document.querySelector('#chart path.t'), 'dibuja la linea de un rival inexistente');
    tab = 'hoy'; render();
    return 'ok (sin rival)';
  }
  return 'ok';
};
